<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">Provider-agnostic orchestration</title><desc id="desc">A shared orchestration layer routes to model providers, fans independent steps out in parallel, and merges results into a controlled workflow.</desc><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#cbd0da" stroke-width="1"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#7c3aed" stroke-width="1.2"/></marker></defs><rect width="720" height="380" fill="#eceef3"/><rect width="720" height="380" fill="url(#grid)"/><text x="24" y="22" fill="#7c3aed" font-family="monospace" font-size="11">ORCHESTRATION / PROVIDER ABSTRACTION</text><g font-family="monospace" text-anchor="middle"><rect x="245" y="42" width="230" height="48" fill="#172033"/><text x="360" y="62" fill="#fff" font-size="12">WORKFLOW GRAPH</text><text x="360" y="79" fill="#d8c8ff" font-size="10">STATE + ROUTING</text><rect x="235" y="122" width="250" height="45" fill="#fff" stroke="#172033" stroke-width="1.5"/><text x="360" y="141" fill="#172033" font-size="12">MODEL ADAPTER</text><text x="360" y="156" fill="#737b8a" font-size="10">COMMON INTERFACE</text><g fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"><path d="M360 90V122"/><path d="M360 167V190H125V218"/><path d="M360 190V218"/><path d="M360 190H595V218"/></g><g fill="#fff" stroke="#172033" stroke-width="1.5"><rect x="35" y="218" width="180" height="54"/><rect x="270" y="218" width="180" height="54"/><rect x="505" y="218" width="180" height="54"/></g><text x="125" y="241" fill="#172033" font-size="12">BEDROCK</text><text x="125" y="258" fill="#737b8a" font-size="10">CONVERSE API</text><text x="360" y="241" fill="#172033" font-size="12">AZURE OPENAI</text><text x="360" y="258" fill="#737b8a" font-size="10">PROVIDER ADAPTER</text><text x="595" y="241" fill="#172033" font-size="12">OPENAI</text><text x="595" y="258" fill="#737b8a" font-size="10">PROVIDER ADAPTER</text><path d="M125 272V294H595V272M360 294V316" fill="none" stroke="#7c3aed" stroke-width="2"/><rect x="240" y="316" width="240" height="40" fill="#fff" stroke="#172033" stroke-width="1.5"/><text x="360" y="341" fill="#172033" font-size="11">PARALLEL STEPS / MERGE</text></g><circle cx="360" cy="190" r="5" fill="#7c3aed"/><circle cx="360" cy="294" r="4" fill="#7c3aed"/></svg>